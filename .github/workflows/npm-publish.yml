name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (do not actually publish)'
        required: false
        type: boolean
        default: false
      skip_npm:
        description: 'Skip npm publish (e.g. re-running only the MCP registry publish after a registry-side failure)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: 'Perform a dry run (do not actually publish)'
        required: false
        type: boolean
        default: false
      skip_npm:
        description: 'Skip npm publish (used by recovery workflow_dispatch runs; auto-release passes false)'
        required: false
        type: boolean
        default: false

env:
  BUN_VERSION: 'latest'
  # The only logins allowed to publish. This declaration used to be decorative:
  # it named the trusted publisher while all three gates below — the job `if:`
  # (twice) and the verify step — carried their own copy of the literal and
  # nothing ever read this key (#741). The step now reads it; the job `if:`
  # still cannot, because a job-level `if:` has no `env` context, so
  # `scripts/check-workflows.ts` (invariant 3) holds the two in agreement.
  # A JSON array so `jq` and GitHub's `fromJSON()` can read the same bytes.
  TRUSTED_PUBLISHERS: '["ignaciohermosillacornejo"]'

permissions:
  contents: read
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # The longest chain in the repo: install, audit, typecheck, lint, the full
    # test suite, build, `npm view`, `npm publish --provenance` (sigstore/OIDC
    # round-trips), up to 10 minutes waiting for npm to serve the version, then a
    # GitHub-releases curl and two mcp-publisher calls. The work itself took
    # about 2 minutes for v3.0.0; the wait is what sizes the bound, and 30 leaves
    # the rest ~20 minutes of headroom so a slow npm cannot cancel a release npm
    # already accepted. Bounding it at all is the point: this job holds
    # `id-token: write`, and 360 minutes of that is not a thing we want.
    timeout-minutes: 30
    # Only run for releases created by trusted publishers, or any other trigger
    # (workflow_dispatch / workflow_call) initiated by the trusted actor. Note: in a
    # workflow_call context, github.event_name reflects the calling workflow's event
    # (e.g. 'push'), not 'workflow_call', so we gate on actor rather than event_name.
    if: |
      (github.event_name == 'release' && github.event.release.author.login == 'ignaciohermosillacornejo') ||
      (github.event_name != 'release' && github.actor == 'ignaciohermosillacornejo')

    steps:
      - name: Verify publisher is trusted
        env:
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            PUBLISHER="$RELEASE_AUTHOR"
          else
            PUBLISHER="$GITHUB_ACTOR"
          fi
          echo "Publisher: $PUBLISHER"
          # Membership in the declared list, not a literal repeated here. Same
          # `IN(...)` spelling as auto-merge.yml's review filter, deliberately:
          # a PR about two expressions that must agree should not leave two
          # spellings of one predicate behind.
          if ! jq -e --arg p "$PUBLISHER" 'IN($p; .[])' <<<"$TRUSTED_PUBLISHERS" >/dev/null; then
            echo "::error::Publisher '$PUBLISHER' is not authorized to publish packages"
            exit 1
          fi
          echo "Publisher '$PUBLISHER' is authorized"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail on vulnerabilities, but log them

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Verify dist files
        run: |
          echo "Checking dist directory contents:"
          ls -la dist/
          if [ ! -f dist/cli.js ]; then
            echo "Error: dist/cli.js not found"
            exit 1
          fi

      # Read once, so the existence check, the publish and the npm poll all name
      # the same version. Assigned to variables first: `echo "x=$(node ...)"`
      # would swallow a node failure under `bash -e`. The shape check also
      # catches `node -p` printing `undefined` for a missing key, and keeps a
      # stray newline from forging extra step outputs. An empty value would
      # otherwise turn the existence check and the npm wait into silent no-ops.
      - name: Read package name and version
        id: pkg
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$PACKAGE_NAME" =~ ^[a-z0-9@/._-]+$ ]] || [ "$PACKAGE_NAME" = undefined ] \
            || ! [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json gave an unusable name ('$PACKAGE_NAME') or version ('$PACKAGE_VERSION')"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on npm
        if: inputs.skip_npm != true && github.event.inputs.skip_npm != 'true'
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION exists on npm..."
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Error: Version $PACKAGE_VERSION already exists on npm"
            exit 1
          fi
          echo "Version $PACKAGE_VERSION is available for publishing"

      - name: Publish to npm (dry run)
        if: (inputs.dry_run == true || github.event.inputs.dry_run == 'true') && inputs.skip_npm != true && github.event.inputs.skip_npm != 'true'
        run: npm publish --dry-run --verbose

      - name: Publish to npm
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true' && inputs.skip_npm != true && github.event.inputs.skip_npm != 'true'
        run: npm publish --provenance --access public --verbose

      # npm answers a publish with 202 ("may take a few minutes to become
      # available"), and the registry refuses a version npm does not serve yet.
      # v3.0.0's registry publish ran seconds after the npm publish and was
      # rejected with "version '3.0.0' was not found". Poll the exact version
      # URL the registry checks before handing off.
      #
      # The bound is wall-clock, not an attempt count: each curl is capped at 10s
      # and the loop stops once 600s have passed, so the step ends within ~10
      # minutes however slow npm answers.
      - name: Wait for npm to serve the version
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          URL="https://registry.npmjs.org/${PACKAGE_NAME}/${PACKAGE_VERSION}"
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            if curl -fsS --max-time 10 -o /dev/null "$URL"; then
              echo "npm serves ${PACKAGE_NAME}@${PACKAGE_VERSION} (attempt ${attempt}, ${SECONDS}s)"
              exit 0
            fi
            if [ "$SECONDS" -ge 600 ]; then
              echo "::warning::npm still does not serve ${PACKAGE_NAME}@${PACKAGE_VERSION} after ${SECONDS}s; publishing to the MCP Registry anyway"
              exit 1
            fi
            echo "npm does not serve ${PACKAGE_NAME}@${PACKAGE_VERSION} yet (attempt ${attempt}, ${SECONDS}s)"
            sleep 10
          done

      - name: Install mcp-publisher
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          MCP_PUBLISHER_VERSION: v1.7.8
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        id: registry_publish
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: ./mcp-publisher publish

      # The registry steps are continue-on-error so a registry hiccup cannot fail
      # a release npm already accepted, but that also leaves the run green when
      # the registry entry was never written (v3.0.0). Say so where it is seen.
      #
      # success(), not always(): a failed continue-on-error step still concludes
      # `success`, so a failure in any of the registry steps reaches this one
      # (an Install or Authenticate failure makes the publish itself fail),
      # while a hard failure upstream (tests, build, `npm publish`) or a
      # cancellation does not. In those cases npm is NOT fine, and the
      # skip_npm=true advice below would register a version npm never accepted.
      # Under this gate the publish always ran, so the only outcome left to
      # report is a failure.
      - name: Report a missed MCP Registry publish
        if: success() && inputs.dry_run != true && github.event.inputs.dry_run != 'true' && steps.registry_publish.outcome != 'success'
        run: |
          MSG="The MCP Registry publish failed after npm had the version. Re-run only the registry steps: gh workflow run npm-publish.yml --ref main -f skip_npm=true -f dry_run=false"
          echo "::warning::${MSG}"
          echo "### MCP Registry not updated" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSG}" >> "$GITHUB_STEP_SUMMARY"
