name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (do not actually publish)'
        required: false
        type: boolean
        default: false
      skip_npm:
        description: 'Skip npm publish (e.g. re-running only the MCP registry publish after a registry-side failure)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        description: 'Perform a dry run (do not actually publish)'
        required: false
        type: boolean
        default: false
      skip_npm:
        description: 'Skip npm publish (used by recovery workflow_dispatch runs; auto-release passes false)'
        required: false
        type: boolean
        default: false

env:
  BUN_VERSION: 'latest'
  # The only logins allowed to publish. This declaration used to be decorative:
  # it named the trusted publisher while all three gates below — the job `if:`
  # (twice) and the verify step — carried their own copy of the literal and
  # nothing ever read this key (#741). The step now reads it; the job `if:`
  # still cannot, because a job-level `if:` has no `env` context, so
  # `scripts/check-workflows.ts` (invariant 3) holds the two in agreement.
  # A JSON array so `jq` and GitHub's `fromJSON()` can read the same bytes.
  TRUSTED_PUBLISHERS: '["ignaciohermosillacornejo"]'

permissions:
  contents: read
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Observed ~55s, and the longest chain in the repo: install, audit,
    # typecheck, lint, the full test suite, build, `npm view`, `npm publish
    # --provenance` (sigstore/OIDC round-trips), then a GitHub-releases curl and
    # two mcp-publisher calls. Three external services set the pace, so it gets
    # the widest bound — the same 20 the other externally-paced job
    # (claude-review) carries. Bounding it at all is the point: this job holds
    # `id-token: write`, and 360 minutes of that is not a thing we want.
    timeout-minutes: 20
    # Only run for releases created by trusted publishers, or any other trigger
    # (workflow_dispatch / workflow_call) initiated by the trusted actor. Note: in a
    # workflow_call context, github.event_name reflects the calling workflow's event
    # (e.g. 'push'), not 'workflow_call', so we gate on actor rather than event_name.
    if: |
      (github.event_name == 'release' && github.event.release.author.login == 'ignaciohermosillacornejo') ||
      (github.event_name != 'release' && github.actor == 'ignaciohermosillacornejo')

    steps:
      - name: Verify publisher is trusted
        env:
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            PUBLISHER="$RELEASE_AUTHOR"
          else
            PUBLISHER="$GITHUB_ACTOR"
          fi
          echo "Publisher: $PUBLISHER"
          # Membership in the declared list, not a literal repeated here. Same
          # `IN(...)` spelling as auto-merge.yml's review filter, deliberately:
          # a PR about two expressions that must agree should not leave two
          # spellings of one predicate behind.
          if ! jq -e --arg p "$PUBLISHER" 'IN($p; .[])' <<<"$TRUSTED_PUBLISHERS" >/dev/null; then
            echo "::error::Publisher '$PUBLISHER' is not authorized to publish packages"
            exit 1
          fi
          echo "Publisher '$PUBLISHER' is authorized"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail on vulnerabilities, but log them

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Verify dist files
        run: |
          echo "Checking dist directory contents:"
          ls -la dist/
          if [ ! -f dist/cli.js ]; then
            echo "Error: dist/cli.js not found"
            exit 1
          fi

      - name: Check if version already exists on npm
        if: inputs.skip_npm != true && github.event.inputs.skip_npm != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION exists on npm..."
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Error: Version $PACKAGE_VERSION already exists on npm"
            exit 1
          fi
          echo "Version $PACKAGE_VERSION is available for publishing"

      - name: Publish to npm (dry run)
        if: (inputs.dry_run == true || github.event.inputs.dry_run == 'true') && inputs.skip_npm != true && github.event.inputs.skip_npm != 'true'
        run: npm publish --dry-run --verbose

      - name: Publish to npm
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true' && inputs.skip_npm != true && github.event.inputs.skip_npm != 'true'
        run: npm publish --provenance --access public --verbose

      - name: Install mcp-publisher
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          MCP_PUBLISHER_VERSION: v1.7.8
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: ./mcp-publisher publish
