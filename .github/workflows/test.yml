name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    # Observed ~1 min. Two separate package installs (`bun install`, plus
    # `npm install --omit=dev` inside .license-check) and an `npx
    # license-checker` fetch make this the most registry-dependent job here,
    # and it gates every PR — so it gets headroom rather than a tight bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Version sync check
        run: bun run check:version-sync

      - name: MCP registry constraints check (server.json)
        run: bun run check:server-json

      - name: Tool count drift check
        run: bun run check:tool-counts

      - name: Privacy endpoints drift check
        run: bun run check:privacy-endpoints

      # Runs on every PR, including forks, because the payload class this
      # catches does not need to be merged to do damage — it only needs to be
      # built once. See scripts/check-concealment.ts.
      - name: Concealed-content check
        run: bun run check:concealment

      # Parses every workflow in this directory, including its own. See
      # scripts/check-workflows.ts for the two invariants and why each exists.
      - name: Workflow hygiene check
        run: bun run check:workflows

      # The gate's whole point is to fail locally, before the push — CI already
      # notices an uncommitted script, just too late (#727). Running it here too
      # costs nothing and keeps the local and CI surfaces identical.
      - name: Tooling files tracked check
        run: bun run check:tracked-files

      # Mutates a source file, runs the one test file that is supposed to
      # notice, restores it. Runs here as well as in `bun run check` because a
      # gate only the author's machine runs is the shape of hole #727 was, and
      # because the whole point of the registry is that "mutation-tested" stops
      # being a claim in a PR body. Seconds: one test file per entry.
      - name: Mutation-guard registry check
        run: bun run check:mutation-guards

      # Free here and nowhere else: CI checks out clean, so the tree must be
      # byte-identical after a step whose whole job is to edit tracked source
      # and put it back. Deliberately NOT a precondition locally — `bun run
      # check` is the pre-push hook and runs mid-edit — and deliberately not
      # the runner's own bookkeeping, which is the thing being checked. Note
      # this job never runs `bun test`, so the "the next command in check is a
      # whole-repo test run over the damage" backstop is a local one.
      #
      # `!cancelled()` rather than `success()` because a FAILING mutation-guard
      # step is the likeliest way a file is left behind, so skipping the
      # independent check on failure would disable it exactly when it has
      # something to say — and rather than `always()`, which also fires on a
      # CANCELLED run, where a step killed mid-mutation legitimately leaves a
      # mutated file and this check would report a second, misleading failure
      # on top of the cancellation. `git status` rather than `git diff` because
      # the runner's give-up path writes an UNTRACKED
      # `<file>.mutation-guard-original` sidecar, which `git diff` cannot see.
      - name: Working tree unchanged by the mutation-guard run
        if: ${{ !cancelled() }}
        run: |
          left=$(git status --porcelain)
          if [ -n "$left" ]; then
            echo "The mutation-guard step left the working tree changed:"
            echo "$left"
            exit 1
          fi

      # Fork PRs only — a same-repo branch already required push access, so
      # there is no identity to forge. Reads public commit metadata with the
      # read-only fork token.
      - name: Commit authorship check
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR/commits?per_page=100" \
            --paginate --jq '.[]' | jq -s '.' | bun run scripts/check-commit-authorship.ts

      - name: License check (production deps)
        # Stages package.json only (NOT package-lock.json) and runs
        # npm install --omit=dev to mirror scripts/pack-mcpb.ts exactly, so
        # the gate measures the same graph that ships in the .mcpb bundle.
        # The nested quotes in --excludePackages are intentional: inside $(...)
        # bash opens a fresh shell-quoting scope, so the inner "..." is its own
        # context and does not conflict with the outer quoting.
        # license-checker is pinned (not @latest) for supply-chain determinism;
        # bump deliberately when SPDX database updates are needed.
        # --onlyAllow matches flat SPDX IDs only. A dep declaring a composite
        # expression like "(MIT OR Apache-2.0)" will fail the gate even when
        # compatible; fix by adding it to --excludePackages with a comment, or
        # switch to license-checker-rseidelsohn which parses expressions.
        run: |
          mkdir -p .license-check
          cp package.json .license-check/
          (cd .license-check && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          npx --yes license-checker@25.0.1 \
            --start .license-check \
            --production \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0' \
            --excludePackages "copilot-money-mcp@$(node -p "require('./package.json').version")" \
            --summary

  # The cross-commit half of the concealment gate (#648). Its own job, not a
  # step in `quality`, for two reasons that both come down to what an attacker
  # can remove:
  #
  #   - It needs a full-history checkout, and `quality` does not. Deepening that
  #     job's checkout would slow every other gate for one of them.
  #   - The status check a branch-protection rule can require is a JOB, not a
  #     step. Delete a step and its job still reports green; delete a required
  #     job and the check stays permanently pending and the pull request cannot
  #     merge. For a gate whose entire purpose is to read code no maintainer has
  #     read yet, that difference is the gate. Register "Cross-commit
  #     concealment" as a required check.
  ghost-lines:
    name: Cross-commit concealment
    # A pull request is the only event with two ends to compare. A push to main
    # has already been through this on the branch, and a direct push is made by
    # somebody with write access — there is no reviewer left to conceal from.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Measured at ~7s over 258 commits and 689 off-tree blobs of this repo's own
    # history; a pull request's range is a small fraction of that. Headroom, not
    # a threshold anything is near.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole reason this job exists. actions/checkout fetches ONE
          # commit by default, so on a pull_request event neither base.sha nor
          # head.sha is present as an object and nothing between them is
          # either. The gate verifies this rather than trusting it — it refuses
          # on a shallow checkout and on a missing endpoint, and names this
          # line as the remedy — so getting it wrong turns CI red with an
          # explanation instead of green over an empty scan.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # No `bun install`: this gate imports node builtins only and shells out to
      # git, so the job is a checkout and a script. A registry outage cannot
      # turn a security gate red, and nothing from the dependency graph runs
      # before it reads the contributor's commits.
      - name: Ghost-lines check
        run: bun run check:ghost-lines

  tests:
    name: Tests
    needs: [quality]
    runs-on: ubuntu-latest
    # Observed ~50s. `bun install` + the full suite with coverage + a Codecov
    # upload that fails the job on error. Grows with the suite, and gates every
    # PR, so it shares the quality job's ceiling.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run all tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
