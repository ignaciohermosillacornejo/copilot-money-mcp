name: Auto Merge on Approval

# Enables GitHub's auto-merge on a PR the owner has approved.
#
# KNOWN LIMITATION — a first-time fork contributor's PR will not trigger this.
# GitHub holds every workflow run from a first-time fork contributor at
# `action_required`. The `pull_request` runs (Tests, Required PR Sections, AI
# Code Review) can be released with
#   gh api -X POST repos/<owner>/<repo>/actions/runs/<id>/approve
# but a `pull_request_review` run cannot: that endpoint answers 403 ("This run
# is not from a fork pull request or queued by the Actions bot") and the run
# dies where it sits. So for exactly the PR where this flow is most convenient —
# someone's first contribution — it silently never fires, and there is no failed
# check to notice. Once that contributor has one merged PR, later runs execute
# normally. Observed on #632, confirmed resolved on #639; see issue #643.
#
# The escape hatch is the `workflow_dispatch` trigger below: the owner fires this
# workflow by hand with the PR number and it does exactly what the review-
# triggered run would have done. It is not a weakening of the fork-PR posture —
# `workflow_dispatch` requires repository write access, so only someone who could
# already merge by hand can fire it, and the "Verify owner approval" step below
# re-checks the PR's live review state on both paths, and that the approval
# belongs to the PR's *current* head commit. It never merges a PR the owner has
# not approved, and never on code the owner has not seen.
#
# Before reaching for it on a branch you did not write, read CONTRIBUTING.md →
# "Reviewing a Contributor Branch (maintainers)". Merging is not the risky step;
# checking the branch out and running it is.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to enable auto-merge on (owner approval is re-verified)'
        required: true
        type: string

jobs:
  auto-merge:
    # Cheap gate on the event payload so a non-owner's approval never starts a
    # runner. The dispatch path has no review payload to gate on, so it is
    # admitted here and verified by the step below — which runs on both paths.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'approved' &&
      github.event.review.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    # Observed 4s. Two shell steps, no checkout and no install — there is
    # nothing in here that can legitimately take minutes, so this is the floor.
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}

    steps:
      - name: Validate PR number
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi

      - name: Verify owner approval
        run: |
          set -euo pipefail
          # Authoritative on both paths: ask the API for the PR's current review
          # state rather than trusting a single review event. Reviews are listed
          # chronologically, so the owner's last *decisive* review (APPROVED /
          # CHANGES_REQUESTED / DISMISSED — COMMENTED does not change a decision)
          # is the one that stands. A dismissed approval therefore reads as
          # not-approved, which a payload check on one submitted review cannot see.
          #
          # Streamed as `.[]` and re-slurped with `jq -s` because `gh api
          # --paginate` applies `--jq` to each page separately — an aggregating
          # filter passed straight to `--jq` would emit one answer per page. Same
          # pattern as the commit-authorship step in test.yml.
          REVIEW=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --paginate --jq '.[]' \
            | jq -s -r --arg owner "$OWNER" '
                [ .[]
                  | select(.user.login == $owner)
                  | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                ] | last | "\(.state // "NONE") \(.commit_id // "-")"
              ')
          STATE="${REVIEW%% *}"
          APPROVED_SHA="${REVIEW##* }"
          echo "Owner review state on PR #$PR_NUMBER: $STATE (at $APPROVED_SHA)"
          if [[ "$STATE" != "APPROVED" ]]; then
            echo "::error::PR #$PR_NUMBER does not carry a standing approval from the repository owner (state: $STATE)"
            exit 1
          fi

          # An approval is given for one commit and survives later pushes unless
          # branch protection dismisses stale reviews. On the review-triggered
          # path head and approval were the same commit by construction — the
          # event fired at approval time. The dispatch path breaks that coupling:
          # it runs at an arbitrary later moment, by PR number, on exactly the
          # fork PRs where the contributor can push in between. `--auto` waits
          # for required checks, but a green CI run is not a code review, so bind
          # the approval to the commit it was actually given for rather than
          # leasing the guarantee from a branch-protection setting.
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [[ "$APPROVED_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::Owner approval is for $APPROVED_SHA but PR #$PR_NUMBER now heads at $HEAD_SHA — re-review the current head"
            exit 1
          fi
          echo "✅ Owner approval verified, at the current head"

      - name: Enable auto-merge
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER"
          # No --delete-branch. On a merge that GitHub refuses, gh falls back to
          # closing the PR and deleting the branch, so a blocked merge silently
          # becomes a closed, branch-deleted PR. Branch cleanup is already
          # handled by the repository's delete_branch_on_merge setting, which
          # only fires on an actual merge — so the flag bought nothing and cost
          # the PR. This matters more now that enforce_admins is on and merges
          # are refused more often.
          gh pr merge "$PR_NUMBER" --auto --rebase --repo "$REPO"
