name: Auto Merge on Approval

on:
  pull_request_review:
    types: [submitted]

jobs:
  auto-merge:
    # Only run when the owner approves
    if: github.event.review.state == 'approved' && github.event.review.user.login == 'ignaciohermosillacornejo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Verify approver is owner
        run: |
          APPROVER="${{ github.event.review.user.login }}"
          echo "Approval from: $APPROVER"
          if [[ "$APPROVER" != "ignaciohermosillacornejo" ]]; then
            echo "::error::Only the repository owner can trigger auto-merge"
            exit 1
          fi
          echo "✅ Owner approval verified"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER"
          # No --delete-branch. On a merge that GitHub refuses, gh falls back to
          # closing the PR and deleting the branch, so a blocked merge silently
          # becomes a closed, branch-deleted PR. Branch cleanup is already
          # handled by the repository's delete_branch_on_merge setting, which
          # only fires on an actual merge — so the flag bought nothing and cost
          # the PR. This matters more now that enforce_admins is on and merges
          # are refused more often.
          gh pr merge "$PR_NUMBER" --auto --rebase --repo "${{ github.repository }}"
